[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/Portafolio/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/portafolio/*"
  to = "/:splat"
  status = 301
  force = true
